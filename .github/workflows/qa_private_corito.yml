name: QA Private Corito

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-private-corito
  cancel-in-progress: false

jobs:
  qa:
    name: Corito Final Device QA (iPhone + iPad, private source)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Read-only SSH deploy key committed nowhere: key material comes from a
      # GitHub Actions secret only. Keyfile is deleted immediately after clone.
      # Identity is provided via -i (file) + IdentitiesOnly=yes; no ssh-agent is
      # used, because IdentitiesOnly=yes disregards agent-provided identities.
      - name: Clone private repo at fixed commit (read-only deploy key)
        env:
          CORITO_PRIVATE_REPO_SSH_KEY: ${{ secrets.CORITO_PRIVATE_REPO_SSH_KEY }}
          PRIVATE_SHA: f247b3a7ca6b26481b4bb7382cc3a1288723472f
        run: |
          echo "Setting up ephemeral SSH deploy key..."
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$CORITO_PRIVATE_REPO_SSH_KEY" > "$HOME/.ssh/corito_qa_ed25519"
          chmod 600 "$HOME/.ssh/corito_qa_ed25519"
          ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          # Preflight: prove the deploy key authenticates to GitHub before cloning.
          AUTH=$(ssh -i "$HOME/.ssh/corito_qa_ed25519" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -T git@github.com 2>&1 || true)
          echo "$AUTH"
          case "$AUTH" in
            *"successfully authenticated"*) echo "DEPLOY_KEY_AUTH=OK" ;;
            *) echo "DEPLOY_KEY_AUTH=FAIL"; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/corito-private"
          GIT_TERMINAL_PROMPT=0 \
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/corito_qa_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=15" \
            git init -q "$RUNNER_TEMP/corito-private"
          git -C "$RUNNER_TEMP/corito-private" remote add origin git@github.com:georgejoelconcepcionlopez-design/corito-domino-flutter.git
          GIT_TERMINAL_PROMPT=0 \
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/corito_qa_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=15" \
            git -C "$RUNNER_TEMP/corito-private" fetch --depth 1 origin "$PRIVATE_SHA"
          git -C "$RUNNER_TEMP/corito-private" checkout -q --detach FETCH_HEAD
          OUR_SHA=$(git -C "$RUNNER_TEMP/corito-private" rev-parse HEAD)
          echo "PRIVATE_HEAD_SHA=$OUR_SHA"
          git -C "$RUNNER_TEMP/corito-private" log -1 --oneline
          if [ "$OUR_SHA" != "$PRIVATE_SHA" ]; then echo "PRIVATE_SHA_MISMATCH"; exit 1; fi
          echo "PRIVATE_CLONE_OK"
          # Wipe the keyfile as soon as the clone is done.
          rm -f "$HOME/.ssh/corito_qa_ed25519" "$HOME/.ssh/corito_qa_ed25519.pub"

      - name: Flutter pub get (private checkout)
        run: |
          cd "$RUNNER_TEMP/corito-private"
          mkdir -p build/ios/SourcePackages
          flutter pub get

      - name: Migrate to pure Swift Package Manager (remove CocoaPods)
        run: |
          cd "$RUNNER_TEMP/corito-private/ios"
          pod deintegrate || true
          rm -f Podfile Podfile.lock
          cd "$RUNNER_TEMP/corito-private"

      - name: Find simulator UDIDs
        run: |
          find_device() {
            local kind="$1"; shift
            for name in "$@"; do
              local udid
              udid=$(xcrun simctl list devices available -j | ruby -rjson -e "d=JSON.parse(STDIN.read)['devices']; d.each{|rt,ds| ds.each{|x| if x['isAvailable'] && x['name']=='$name' then print x['udid']; exit end } }")
              if [ -n "$udid" ]; then echo "$udid"; return 0; fi
            done
            xcrun simctl list devices available -j | ruby -rjson -e "d=JSON.parse(STDIN.read)['devices']; d.each{|rt,ds| ds.each{|x| if x['isAvailable'] && x['name'].include?('$kind') then print x['udid']; exit end } }"
          }
          IPHONE=$(find_device iPhone "iPhone 17 Pro Max" "iPhone 16 Pro Max" "iPhone 15 Pro Max")
          IPAD=$(find_device iPad "iPad Pro 13-inch (M4)" "iPad Pro 13-inch" "iPad Pro 12.9-inch (6th generation)")
          echo "iPhone UDID: $IPHONE"
          echo "iPad UDID:   $IPAD"
          if [ -z "$IPHONE" ]; then echo "NO_IPHONE_SIM_FOUND"; exit 1; fi
          if [ -z "$IPAD" ]; then echo "NO_IPAD_SIM_FOUND"; exit 1; fi
          echo "IPHONE_UDID=$IPHONE" >> "$GITHUB_ENV"
          echo "IPAD_UDID=$IPAD" >> "$GITHUB_ENV"
          echo "UDIDS_OK"

      - name: Boot simulators
        run: |
          echo "Booting $IPHONE_UDID"
          xcrun simctl boot "$IPHONE_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          echo "iPhone booted"
          echo "Booting $IPAD_UDID"
          xcrun simctl boot "$IPAD_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$IPAD_UDID" -b
          echo "BOTH_BOOTED"
          xcrun simctl list devices booted

      - name: Build real app (simulator, debug) once
        run: |
          cd "$RUNNER_TEMP/corito-private"
          flutter build ios --simulator
          cp -R build/ios/iphonesimulator/Runner.app /tmp/RunnerReal.app
          touch "$RUNNER_TEMP/.app_built"
          echo "REAL_APP_BUILT"

      - name: Offline surface audit (app has no remote dependencies)
        run: |
          cd "$RUNNER_TEMP/corito-private"
          grep -rnE "package:http|package:dio|package:web_socket_channel|HttpClient|Socket\(" lib pubspec.yaml ios 2>/dev/null || echo "NO_REMOTE_DEPENDENCIES_FOUND"
          echo "OFFLINE_AUDIT_DONE"

      # ========================= iPhone =========================
      - name: QA drive - iPhone
        id: qa-iphone
        timeout-minutes: 25
        run: |
          cd "$RUNNER_TEMP/corito-private"
          set +e
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/qa_test.dart --dart-define=QA_DEVICE=iphone -d "$IPHONE_UDID" 2>&1 | tee /tmp/drive_iphone.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "DRIVE_EXIT_IPHONE=$RC"
          printf '%s\n' "$RC" > "$RUNNER_TEMP/drive_exit_iphone.txt"
          grep -E '^QA_|^SEVERE|^Error' /tmp/drive_iphone.log | head -80 || true
          if [ "$RC" -ne 0 ]; then
            echo "--- POST-FAIL DIAGNOSTICS (iPhone) ---"
            echo "--- last 120 lines of drive log ---"
            tail -120 /tmp/drive_iphone.log || true
            echo "--- relevant drive log lines ---"
            grep -E 'QA_PHASE|EXCEPTION|Exception|Expected|Actual|FlutterError|PlatformDispatcher|stack|FAILED|QA_TOTAL|Multiple exceptions' /tmp/drive_iphone.log | tail -120 || true
            echo "--- booted devices ---"
            xcrun simctl list devices booted || true
            echo "--- runner processes ---"
            ps aux | grep -F "Runner.app" | grep -v grep || echo "NO_RUNNER_PROC"
            echo "--- simulator log (bundle + runner, filtered) ---"
            xcrun simctl spawn "$IPHONE_UDID" log show --last 6m --style compact --predicate 'processImagePath CONTAINS "Runner"' 2>/dev/null | grep -iE 'flutter|exception|error|fatal' | tail -80 || true
            echo "--- simulator log (bundle id direct) ---"
            xcrun simctl spawn "$IPHONE_UDID" log show --last 6m --style compact --predicate 'process == "com.geoappsdominicana.coritoedomino"' 2>/dev/null | grep -iE 'flutter|exception|error|fatal' | tail -60 || true
          fi
          # Recover the harness phase/exception log written by qa_test.dart.
          # v2: on iOS the harness now writes to $HOME/Documents/qa_app.log
          # (sandbox root = the DATA container returned below); -L follows
          # symlinks so systemTemp variants are caught too.
          APP_DATA=$(xcrun simctl get_app_container "$IPHONE_UDID" com.geoappsdominicana.coritoedomino data 2>/dev/null || true)
          echo "APP_DATA_IPHONE=$APP_DATA"
          if [ -n "$APP_DATA" ]; then
            find -L "$APP_DATA" -maxdepth 10 -name 'qa_app.log' -exec cp -f {} /tmp/qa_app_iphone.log \; 2>/dev/null || true
          fi
          if [ -f /tmp/qa_app_iphone.log ]; then
            echo "=== HARNESS qa_app_iphone.log ==="
            cat /tmp/qa_app_iphone.log
          else
            # Fallback: HOME may not equal the data container on some runtimes.
            for c in "$APP_DATA" "$(xcrun simctl get_app_container "$IPHONE_UDID" com.geoappsdominicana.coritoedomino app 2>/dev/null || true)"; do
              [ -n "$c" ] && find -L "$c" -maxdepth 14 -iname 'qa_app.log' -exec cp -f {} /tmp/qa_app_iphone.log \; 2>/dev/null || true
              [ -f /tmp/qa_app_iphone.log ] && break
            done
            if [ -f /tmp/qa_app_iphone.log ]; then
              echo "=== HARNESS qa_app_iphone.log ==="
              cat /tmp/qa_app_iphone.log
            else
              echo "NO_HARNESS_LOG_IPHONE"
            fi
          fi
          exit "$RC"

      - name: iPhone - persistence, rotation, update-install checks
        if: always()
        run: |
          if [ ! -f /tmp/drive_iphone.log ] || [ ! -f "$RUNNER_TEMP/.app_built" ]; then
            echo "PERSIST_IPHONE=SKIP(drive/build prerequisite absent)"
            exit 0
          fi
          BUNDLE=com.geoappsdominicana.coritoedomino
          echo "=== prefs before reinstall ==="
          CONT=$(xcrun simctl get_app_container "$IPHONE_UDID" "$BUNDLE" data)
          echo "container: $CONT"
          plutil -p "$CONT/Library/Preferences/$BUNDLE.plist" > /tmp/prefs_iphone_before.txt 2>/dev/null || echo "NO_PLIST_BEFORE"
          if grep -q '30,0' /tmp/prefs_iphone_before.txt; then echo "PERSIST_IPHONE=PASS(active 30,0)"; else echo "PERSIST_IPHONE=CHECK"; fi
          echo "=== update-install real app (preserves container) ==="
          xcrun simctl install "$IPHONE_UDID" /tmp/RunnerReal.app
          echo "INSTALLED_REAL_APP"
          plutil -p "$CONT/Library/Preferences/$BUNDLE.plist" > /tmp/prefs_iphone_after.txt 2>/dev/null || echo "NO_PLIST_AFTER"
          if grep -q '30,0' /tmp/prefs_iphone_after.txt; then echo "UPDATE_KEEP_IPHONE=PASS(active preserved)"; else echo "UPDATE_KEEP_IPHONE=FAIL"; fi
          xcrun simctl launch "$IPHONE_UDID" "$BUNDLE" || echo "LAUNCH_FAIL"
          sleep 8
          echo "=== rotation checks (must not crash) ==="
          xcrun simctl ui "$IPHONE_UDID" orientation portrait
          sleep 1
          xcrun simctl io "$IPHONE_UDID" screenshot /tmp/qa_rotate_iphone_portrait.png
          xcrun simctl ui "$IPHONE_UDID" orientation landscape-left
          sleep 2
          xcrun simctl io "$IPHONE_UDID" screenshot /tmp/qa_rotate_iphone_landscape.png
          xcrun simctl ui "$IPHONE_UDID" orientation portrait
          sleep 1
          if ps aux | grep -F "/Runner.app/" | grep -v grep >/dev/null; then
            echo "ROTATION_IPHONE=PASS(alive)"
          else
            echo "ROTATION_IPHONE=FAIL(no Runner process)"
          fi

      # ========================= iPad =========================
      - name: QA drive - iPad
        id: qa-ipad
        if: always()
        timeout-minutes: 25
        run: |
          # iPad must run/diagnose even if iPhone failed, but never on a broken
          # base environment (clone/build/boot failed).
          if [ ! -f "$RUNNER_TEMP/.app_built" ] || [ -z "$IPAD_UDID" ]; then
            echo "IPAD_DRIVE_SKIPPED(env prerequisite absent)"
            printf '%s\n' "skip" > "$RUNNER_TEMP/drive_exit_ipad.txt"
            exit 0
          fi
          cd "$RUNNER_TEMP/corito-private"
          set +e
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/qa_test.dart --dart-define=QA_DEVICE=ipad -d "$IPAD_UDID" 2>&1 | tee /tmp/drive_ipad.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "DRIVE_EXIT_IPAD=$RC"
          printf '%s\n' "$RC" > "$RUNNER_TEMP/drive_exit_ipad.txt"
          grep -E '^QA_|^SEVERE|^Error' /tmp/drive_ipad.log | head -80 || true
          if [ "$RC" -ne 0 ]; then
            echo "--- POST-FAIL DIAGNOSTICS (iPad) ---"
            echo "--- last 120 lines of drive log ---"
            tail -120 /tmp/drive_ipad.log || true
            echo "--- relevant drive log lines ---"
            grep -E 'QA_PHASE|EXCEPTION|Exception|Expected|Actual|FlutterError|PlatformDispatcher|stack|FAILED|QA_TOTAL|Multiple exceptions' /tmp/drive_ipad.log | tail -120 || true
            echo "--- booted devices ---"
            xcrun simctl list devices booted || true
            echo "--- runner processes ---"
            ps aux | grep -F "Runner.app" | grep -v grep || echo "NO_RUNNER_PROC"
            echo "--- simulator log (bundle + runner, filtered) ---"
            xcrun simctl spawn "$IPAD_UDID" log show --last 6m --style compact --predicate 'processImagePath CONTAINS "Runner"' 2>/dev/null | grep -iE 'flutter|exception|error|fatal' | tail -80 || true
            echo "--- simulator log (bundle id direct) ---"
            xcrun simctl spawn "$IPAD_UDID" log show --last 6m --style compact --predicate 'process == "com.geoappsdominicana.coritoedomino"' 2>/dev/null | grep -iE 'flutter|exception|error|fatal' | tail -60 || true
          fi
          # Recover the harness phase/exception log written by qa_test.dart.
          # v2: on iOS the harness now writes to $HOME/Documents/qa_app.log
          # (sandbox root = the DATA container returned below); -L follows
          # symlinks so systemTemp variants are caught too.
          APP_DATA=$(xcrun simctl get_app_container "$IPAD_UDID" com.geoappsdominicana.coritoedomino data 2>/dev/null || true)
          echo "APP_DATA_IPAD=$APP_DATA"
          if [ -n "$APP_DATA" ]; then
            find -L "$APP_DATA" -maxdepth 10 -name 'qa_app.log' -exec cp -f {} /tmp/qa_app_ipad.log \; 2>/dev/null || true
          fi
          if [ -f /tmp/qa_app_ipad.log ]; then
            echo "=== HARNESS qa_app_ipad.log ==="
            cat /tmp/qa_app_ipad.log
          else
            # Fallback: HOME may not equal the data container on some runtimes.
            for c in "$APP_DATA" "$(xcrun simctl get_app_container "$IPAD_UDID" com.geoappsdominicana.coritoedomino app 2>/dev/null || true)"; do
              [ -n "$c" ] && find -L "$c" -maxdepth 14 -iname 'qa_app.log' -exec cp -f {} /tmp/qa_app_ipad.log \; 2>/dev/null || true
              [ -f /tmp/qa_app_ipad.log ] && break
            done
            if [ -f /tmp/qa_app_ipad.log ]; then
              echo "=== HARNESS qa_app_ipad.log ==="
              cat /tmp/qa_app_ipad.log
            else
              echo "NO_HARNESS_LOG_IPAD"
            fi
          fi
          exit "$RC"

      - name: iPad - persistence, rotation, update-install checks
        if: always()
        run: |
          if [ ! -f /tmp/drive_ipad.log ] || [ ! -f "$RUNNER_TEMP/.app_built" ]; then
            echo "PERSIST_IPAD=SKIP(drive/build prerequisite absent)"
            exit 0
          fi
          BUNDLE=com.geoappsdominicana.coritoedomino
          echo "=== prefs before reinstall ==="
          CONT=$(xcrun simctl get_app_container "$IPAD_UDID" "$BUNDLE" data)
          echo "container: $CONT"
          plutil -p "$CONT/Library/Preferences/$BUNDLE.plist" > /tmp/prefs_ipad_before.txt 2>/dev/null || echo "NO_PLIST_BEFORE"
          if grep -q '30,0' /tmp/prefs_ipad_before.txt; then echo "PERSIST_IPAD=PASS(active 30,0)"; else echo "PERSIST_IPAD=CHECK"; fi
          echo "=== update-install real app (preserves container) ==="
          xcrun simctl install "$IPAD_UDID" /tmp/RunnerReal.app
          echo "INSTALLED_REAL_APP"
          plutil -p "$CONT/Library/Preferences/$BUNDLE.plist" > /tmp/prefs_ipad_after.txt 2>/dev/null || echo "NO_PLIST_AFTER"
          if grep -q '30,0' /tmp/prefs_ipad_after.txt; then echo "UPDATE_KEEP_IPAD=PASS(active preserved)"; else echo "UPDATE_KEEP_IPAD=FAIL"; fi
          xcrun simctl launch "$IPAD_UDID" "$BUNDLE" || echo "LAUNCH_FAIL"
          sleep 8
          echo "=== rotation checks ==="
          xcrun simctl ui "$IPAD_UDID" orientation portrait
          sleep 1
          xcrun simctl io "$IPAD_UDID" screenshot /tmp/qa_rotate_ipad_portrait.png
          xcrun simctl ui "$IPAD_UDID" orientation landscape-left
          sleep 2
          xcrun simctl io "$IPAD_UDID" screenshot /tmp/qa_rotate_ipad_landscape.png
          xcrun simctl ui "$IPAD_UDID" orientation portrait
          sleep 1
          if ps aux | grep -F "/Runner.app/" | grep -v grep >/dev/null; then
            echo "ROTATION_IPAD=PASS(alive)"
          else
            echo "ROTATION_IPAD=FAIL(no Runner process)"
          fi

      - name: Crash-log sweep
        if: always()
        run: |
          BUNDLE=com.geoappsdominicana.coritoedomino
          for udid in "$IPHONE_UDID" "$IPAD_UDID"; do
            if [ -n "$udid" ]; then
              xcrun simctl spawn "$udid" log show --last 30m --style compact --predicate "process == '$BUNDLE'" 2>/dev/null > "/tmp/log_${udid}.txt" || true
            fi
          done
          echo "=== crash markers in app logs ==="
          cat /tmp/log_*.txt 2>/dev/null | grep -iE "exception|fatal|sigabrt|sigsegv|dyld|uncaught" | grep -v "0 (null)" | head -40 || echo "NO_CRASH_MARKERS"
          echo "=== QA drive console markers ==="
          grep -E 'QA_PHASE\|FAIL|^QA_TOTAL|^QA_STOREKIT|^QA_URLS|QA_EXCEPTION|QA_D_AFTER_SAVE|QA_UI_AT_FAIL' /tmp/drive_iphone.log /tmp/drive_ipad.log || echo "NO_QA_LOG_RECORDED"

      - name: Check QA results
        if: always()
        run: |
          echo "=== drive exit codes ==="
          echo "DRIVE_EXIT_IPHONE=$(cat "$RUNNER_TEMP/drive_exit_iphone.txt" 2>/dev/null || echo unset)"
          echo "DRIVE_EXIT_IPAD=$(cat "$RUNNER_TEMP/drive_exit_ipad.txt" 2>/dev/null || echo unset)"
          echo "=== harness phase/exception logs ==="
          grep -hE 'QA_PHASE\||QA_EXCEPTION|QA_SUMMARY|^total_phases=|^passed=|^failed=|^unexpected_exceptions=|^result=' /tmp/qa_app_iphone.log /tmp/qa_app_ipad.log 2>/dev/null | sort -u || echo "NO_HARNESS_LOGS"
          echo "=== drive log marker counts ==="
          IP_FAILS=$(grep -c 'QA_PHASE|FAIL' /tmp/drive_iphone.log 2>/dev/null || true)
          PAD_FAILS=$(grep -c 'QA_PHASE|FAIL' /tmp/drive_ipad.log 2>/dev/null || true)
          echo "IPHONE_PHASE_FAILS=$IP_FAILS"
          echo "IPAD_PHASE_FAILS=$PAD_FAILS"
          IPE=$(cat "$RUNNER_TEMP/drive_exit_iphone.txt" 2>/dev/null || echo unset)
          IPD=$(cat "$RUNNER_TEMP/drive_exit_ipad.txt" 2>/dev/null || echo unset)
          FAIL=0
          if [ "$IPE" = "unset" ]; then echo "IPHONE_DRIVE_NEVER_RAN"; FAIL=1; fi
          if [ "$IPD" = "unset" ]; then echo "IPAD_DRIVE_NEVER_RAN"; FAIL=1; fi
          if [ -n "$IPE" ] && [ "$IPE" != "0" ]; then echo "QA_FAILED_IPHONE(drive exit $IPE)"; FAIL=1; fi
          if [ -n "$IPD" ] && [ "$IPD" != "skip" ] && [ "$IPD" != "0" ]; then echo "QA_FAILED_IPAD(drive exit $IPD)"; FAIL=1; fi
          if [ -n "$IP_FAILS" ] && [ "$IP_FAILS" != "0" ]; then echo "QA_FAILED_IPHONE_PHASES"; FAIL=1; fi
          if [ -n "$PAD_FAILS" ] && [ "$PAD_FAILS" != "0" ]; then echo "QA_FAILED_IPAD_PHASES"; FAIL=1; fi
          # Harness-file unexpected exceptions also fail the gate.
          UNEXPECTED=$(grep -ch '^QA_EXCEPTION' /tmp/qa_app_iphone.log /tmp/qa_app_ipad.log 2>/dev/null | awk '{s+=$1} END{print s+0}' || true)
          echo "UNEXPECTED_EXCEPTIONS=$UNEXPECTED"
          if [ -n "$UNEXPECTED" ] && [ "$UNEXPECTED" != "0" ]; then echo "QA_UNEXPECTED_EXCEPTIONS_DETECTED"; FAIL=1; fi
          if [ "$FAIL" -eq 0 ]; then echo "QA_ALL_PHASES_OK"; else exit 1; fi

      # Only explicitly safe files are staged for upload. No source, no .git,
      # no DerivedData, no secrets, no keychains.
      - name: Prepare safe artifact set
        if: always()
        run: |
          SAFE="$RUNNER_TEMP/qa-safe-artifacts"
          rm -rf "$SAFE"
          mkdir -p "$SAFE/screenshots" "$SAFE/logs"
          cp -f "$RUNNER_TEMP/corito-private"/build/screenshots/*.png "$SAFE/screenshots/" 2>/dev/null || echo "NO_SCREENSHOTS"
          cp -f /tmp/qa_rotate_*.png "$SAFE/screenshots/" 2>/dev/null || true
          cp -f /tmp/drive_iphone.log /tmp/drive_ipad.log "$SAFE/logs/" 2>/dev/null || true
          cp -f /tmp/qa_app_iphone.log /tmp/qa_app_ipad.log "$SAFE/logs/" 2>/dev/null || true
          cp -f /tmp/prefs_iphone_before.txt /tmp/prefs_iphone_after.txt /tmp/prefs_ipad_before.txt /tmp/prefs_ipad_after.txt "$SAFE/logs/" 2>/dev/null || true
          cp -f /tmp/log_*.txt "$SAFE/logs/" 2>/dev/null || true
          {
            echo "DRIVE_EXIT_IPHONE=$(cat "$RUNNER_TEMP/drive_exit_iphone.txt" 2>/dev/null || echo unset)"
            echo "DRIVE_EXIT_IPAD=$(cat "$RUNNER_TEMP/drive_exit_ipad.txt" 2>/dev/null || echo unset)"
            echo "IPHONE_PHASE_FAILS=$(grep -c 'QA_PHASE|FAIL' /tmp/drive_iphone.log 2>/dev/null || echo 0)"
            echo "IPAD_PHASE_FAILS=$(grep -c 'QA_PHASE|FAIL' /tmp/drive_ipad.log 2>/dev/null || echo 0)"
            grep -hE 'QA_PHASE\|PASS|QA_PHASE\|FAIL|QA_TOTAL|QA_STOREKIT|QA_URLS|QA_EXCEPTION|QA_SUMMARY|QA_D_AFTER_SAVE|QA_UI_AT_FAIL|QA_LOG_PATH_FINAL|total_phases=|passed=|failed=|unexpected_exceptions=|result=' /tmp/drive_iphone.log /tmp/drive_ipad.log /tmp/qa_app_iphone.log /tmp/qa_app_ipad.log 2>/dev/null | sort -u
            grep -hE 'PERSIST_IPHONE|UPDATE_KEEP_IPHONE|ROTATION_IPHONE|PERSIST_IPAD|UPDATE_KEEP_IPAD|ROTATION_IPAD' /tmp/qa_*.txt 2>/dev/null || true
          } > "$SAFE/QA_RESULT.txt"
          echo "SAFE_ARTIFACTS_READY"
          ls -la "$SAFE"
          find "$SAFE" -type f | sed "s|$RUNNER_TEMP/||" | sort

      - name: Upload QA artifacts (retention 1 day)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-build37-artifacts
          path: ${{ runner.temp }}/qa-safe-artifacts
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup private checkout
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/corito-private"
          rm -f "$HOME/.ssh/corito_qa_ed25519" "$HOME/.ssh/corito_qa_ed25519.pub"
          echo "PRIVATE_CHECKOUT_CLEANED"